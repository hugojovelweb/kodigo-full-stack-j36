# Load Balancer (equivale a un Application Load Balancer de AWS)
# Reparte las peticiones entre todas las réplicas del servicio "api".

# DNS interno de Docker: se vuelve a consultar cada 5 s,
# así el balanceador ve las réplicas nuevas cuando escalas.
resolver 127.0.0.11 valid=5s ipv6=off;

upstream api_servers {
    zone api_servers 64k;
    # "resolve" mantiene la lista de réplicas actualizada.
    # max_fails / fail_timeout: si una réplica falla, sale de rotación 10 s (health check pasivo).
    server api:3000 resolve max_fails=1 fail_timeout=10s;
}

server {
    listen 80;

    location / {
        proxy_pass http://api_servers;

        # Si una réplica no responde (caída o colgada), reintenta con la siguiente.
        # Un 503 de la app ("sin base de datos") es una respuesta válida: no saca la réplica de rotación.
        proxy_next_upstream error timeout;
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;

        # Muestra en la respuesta qué réplica atendió la petición.
        add_header X-Atendido-Por $upstream_addr always;
    }
}
