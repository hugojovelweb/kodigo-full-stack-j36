# API Gateway (equivale a Amazon API Gateway)
# Único punto de entrada: valida la API key, limita peticiones y enruta al balanceador.

# Rate limiting: máximo 5 peticiones por segundo por IP (con una ráfaga de 5 extra).
limit_req_zone $binary_remote_addr zone=por_ip:10m rate=5r/s;

# API keys válidas (en AWS: usage plans y API keys, o tokens JWT).
map $http_x_api_key $api_key_valida {
    default        0;
    "kodigo-2026"  1;
}

server {
    listen 80;
    default_type application/json;

    # Ruta pública: no pide API key
    location = /health {
        proxy_pass http://lb/health;
    }

    # Todo lo que empieza con /api/ va al servicio (sin el prefijo /api)
    location /api/ {
        if ($api_key_valida = 0) {
            return 401 '{"error":"Falta la cabecera x-api-key o no es válida"}\n';
        }

        limit_req zone=por_ip burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://lb/;
        proxy_set_header X-Real-IP $remote_addr;
        add_header X-Gateway "reservaya-gateway" always;
    }

    # Cualquier otra ruta no está expuesta
    location / {
        return 404 '{"error":"Ruta no expuesta por el gateway"}\n';
    }
}
