# ReservaYa: arquitectura AWS simulada en local
#
#   Cliente → gateway (API Gateway) → lb (ALB) → api × 3 (ECS Service) → db (RDS)
#
# Solo el gateway publica un puerto. La base de datos y las réplicas quedan
# en la red interna, igual que en subredes privadas de una VPC.

services:
  db:                       # ≈ Amazon RDS for PostgreSQL
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: reservaya
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d reservaya"]
      interval: 5s
      retries: 10
    # Sin "ports": la base no es accesible desde fuera (como RDS sin acceso público).

  api:                      # ≈ ECS Service con 3 tareas (Task Definition = este bloque)
    build: ./api
    environment:
      DATABASE_URL: postgres://app_user:${DB_PASSWORD}@db:5432/reservaya
    deploy:
      replicas: 3           # ≈ desired count del servicio
    restart: always         # ≈ ECS reemplaza las tareas que se caen
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 5s
      retries: 5

  lb:                       # ≈ Application Load Balancer
    image: nginx:1.28-alpine
    volumes:
      - ./nginx/lb.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy

  gateway:                  # ≈ Amazon API Gateway
    image: nginx:1.28-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/gateway.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - lb

volumes:
  db-data:                  # ≈ el almacenamiento de la instancia RDS
