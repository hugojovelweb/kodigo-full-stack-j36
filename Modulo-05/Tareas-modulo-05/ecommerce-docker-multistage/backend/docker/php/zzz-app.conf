; Se carga DESPUÉS de zz-docker.conf (orden alfabético) y lo sobrescribe.
[www]
; Solo loopback: el socket FastCGI NO queda expuesto a otros contenedores
listen = 127.0.0.1:9000
pm = dynamic
pm.max_children = 10
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 5
pm.max_requests = 500
