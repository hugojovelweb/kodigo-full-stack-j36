# Nginx como proxy inverso hacia PHP-FPM (127.0.0.1:9000, dentro del mismo contenedor)
server {
    listen 80 default_server;
    server_name _;

    root /var/www/html/public;
    index index.php;

    server_tokens off;
    client_max_body_size 10m;
    charset utf-8;

    gzip on;
    gzip_types application/json text/css application/javascript text/plain;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Healthcheck liviano (no toca PHP ni la BD)
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Único punto de entrada PHP: public/index.php
    location = /index.php {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
    }

    # Cualquier otro .php se bloquea (evita ejecutar archivos subidos)
    location ~ \.php$ {
        return 404;
    }

    # Archivos ocultos (.env, .git, ...) nunca se sirven
    location ~ /\.(?!well-known) {
        deny all;
    }
}
