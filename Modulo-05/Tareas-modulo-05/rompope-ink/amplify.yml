# amplify.yml — va en la RAÍZ del repo kodigo-full-stack-j36 (monorepo).
# Ajusta appRoot a la ruta real del proyecto dentro del repo
# (dentro de la carpeta del proyecto: git rev-parse --show-prefix  → imprime la ruta).
version: 1
applications:
  - appRoot: Modulo-05/Tareas-modulo-05/rompope-ink   # <-- AJUSTAR
    frontend:
      phases:
        preBuild:
          commands:
            - nvm install 22
            - nvm use 22
            - node -v
            - npm ci
        build:
          commands:
            # Pasa las variables al runtime del servidor (SSR / Route Handlers)
            - env | grep -E '^NEXT_PUBLIC_[A-Z0-9_]+=' >> .env.production || true
            - npm run build
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
          - .next/cache/**/*
